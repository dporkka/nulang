[target.x86_64-unknown-linux-gnu]
linker = "gcc"
rustflags = ["-C", "link-arg=-fuse-ld=bfd", "-C", "link-arg=-Wl,--export-dynamic"]

[env]
PYO3_USE_ABI3_FORWARD_COMPATIBILITY = "1"

[build]
target-dir = "/tmp/cargo-target"

# quick-xml 0.14 (pulled in transitively by `inferno` for flamegraph support)
# carries a future-incompat lint for code that a future Rust release will
# reject. It is a one-time informational notice from a transitive dependency,
# not a warning in our code, and the zero-warning gate (`verify_implementation.py`)
# counts it. Suppress the proactive report so the gate stays meaningful.
[future-incompat-report]
frequency = "never"

name: Feature Request
description: Suggest an idea for Nulang
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >
        Note: changes to Frozen or Stable language surfaces require an RFC —
        see [GOVERNANCE.md](../../blob/main/GOVERNANCE.md) and
        `RFC/0000-template.md`.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or pain point.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Sketch syntax or behavior if applicable.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about, or how you work around this today.
  - type: input
    id: version
    attributes:
      label: Nulang version (if relevant)
      placeholder: e.g. 1.0.0-frozen

name: VS Code Extension

on:
  push:
    branches: [main]
    paths:
      - 'editors/vscode/**'
      - '.github/workflows/vscode-extension.yml'
  pull_request:
    paths:
      - 'editors/vscode/**'
      - '.github/workflows/vscode-extension.yml'
  workflow_dispatch:
  push:
    tags: ['ext-v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  # -----------------------------------------------------------------------
  # Build & package the .vsix (grammar + LSP client)
  # -----------------------------------------------------------------------
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install dependencies
        working-directory: editors/vscode
        run: npm ci

      - name: Compile
        working-directory: editors/vscode
        run: npm run compile

      - name: Package
        working-directory: editors/vscode
        run: npx vsce package --out nulang.vsix

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nulang-vsix
          path: editors/vscode/nulang.vsix

  # -----------------------------------------------------------------------
  # Integration test: real VS Code + real `nulang --lsp`
  # -----------------------------------------------------------------------
  test:
    name: Integration Test (VS Code + LSP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build nulang
        run: cargo build --bin nulang

      - name: Install dependencies
        working-directory: editors/vscode
        run: npm ci

      - name: Run integration tests
        working-directory: editors/vscode
        env:
          NULANG_PATH: ${{ github.workspace }}/target/debug/nulang
        # Headless VS Code occasionally crashes its renderer at startup under
        # xvfb (random, ~10-20%). Retry up to 3 times: deterministic test
        # failures fail every attempt, so only startup crashes are retried.
        run: |
          for i in 1 2 3; do
            echo "=== Test attempt $i ==="
            if xvfb-run -a npm test > /tmp/nulang-test.log 2>&1; then
              exit 0
            fi
            if grep -q "passing" /tmp/nulang-test.log; then
              echo "Tests ran and failed (deterministic failure):"
              tail -50 /tmp/nulang-test.log
              exit 1
            fi
            echo "Startup crash (no test results); retrying..."
          done
          echo "All attempts failed:"
          tail -50 /tmp/nulang-test.log
          exit 1

  # -----------------------------------------------------------------------
  # Publish on ext-v* tags: VS Code Marketplace + Open VSX
  # (secrets: VSCE_PAT = Azure DevOps PAT, OVSX_TOKEN = Open VSX token)
  # -----------------------------------------------------------------------
  publish:
    name: Publish (Marketplace + Open VSX)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/ext-v')
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: nulang-vsix
          path: vsix

      - name: Publish to VS Code Marketplace
        working-directory: editors/vscode
        run: npx --yes @vscode/vsce publish --packagePath ../../vsix/nulang.vsix --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        working-directory: editors/vscode
        run: npx --yes ovsx publish ../../vsix/nulang.vsix --skip-duplicate
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
